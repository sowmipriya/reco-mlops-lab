# Local serving stack: Redis online store, Redpanda (Kafka API) event stream, MLflow registry,
# recommendation API.
services:
  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]

  # Kafka-compatible broker (single node). Inside Docker: redpanda:9092. From the host: localhost:19092.
  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]

  # Web UI: topics, messages, partitions, consumer groups and their lag.
  redpanda-console:
    image: redpandadata/console:v2.8.5
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8090:8080"]
    depends_on: [redpanda]

  mlflow:
    image: python:3.12-slim
    command: >
      sh -c "pip install -q mlflow==3.18.0 && mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts '*'"
    ports: ["5001:5000"]
    volumes: ["./mlflow:/mlflow"]

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8000:8000"]
    depends_on: [redis, mlflow]
