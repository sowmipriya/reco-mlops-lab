# Local serving stack: Redis online store + MLflow registry + recommendation API.
services:
  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]

  mlflow:
    image: python:3.12-slim
    command: >
      sh -c "pip install -q mlflow==3.18.0 && mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts '*'"
    ports: ["5001:5000"]
    volumes: ["./mlflow:/mlflow"]

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8000:8000"]
    depends_on: [redis, mlflow]
