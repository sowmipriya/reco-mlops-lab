reco:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth            # uses Application Default Credentials locally
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: staging         # default dataset; layers override via +schema
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      priority: interactive
    ci:
      type: bigquery
      method: service-account  # key or workload identity in CI
      keyfile: "{{ env_var('GCP_KEYFILE', '') }}"
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: staging
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
