version: 2

models:
  - name: feat_customer_profile
    description: Customer features materialised to the online store (Redis).
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: segment
        data_tests: [not_null]
  - name: feat_item_popularity
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: feat_segment_popularity
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["segment", "product_id"]
  - name: ml_training_interactions
    description: Training matrix (train split only).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["customer_id", "product_id"]
    columns:
      - name: weight
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
  - name: ml_eval_targets
    description: Ground truth for offline Top-K evaluation (test split).
