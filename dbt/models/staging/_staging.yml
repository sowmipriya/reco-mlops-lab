version: 2

models:
  - name: stg_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["view", "add_to_cart", "purchase"]
      - name: event_ts
        data_tests: [not_null, not_in_future]
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: price_eur
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ["diy_beginner", "diy_expert", "professional", "gardener"]
  - name: stg_promotions
    columns:
      - name: promotion_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
