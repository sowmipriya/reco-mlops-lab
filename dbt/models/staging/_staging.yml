version: 2

models:
  - name: stg_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["view", "add_to_cart", "purchase"]
      - name: event_ts
        data_tests: [not_null, not_in_future]
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["tools", "kitchen", "plumbing_bathroom", "heating_climate", "storage_lighting", "garden"]
      - name: price
        description: Median observed price. 0 means missing in the source (product set inactive).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: first_seen_ts
        data_tests: [not_null]
