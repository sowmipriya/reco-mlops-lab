version: 2

sources:
  - name: raw
    description: >
      Data landed from source domains. Here: one month of the public REES46 e-commerce
      dataset, filtered to home-improvement categories (see src/reco/data/prepare_rees46.py).
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: raw
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    tables:
      - name: events
        description: Customer behavioural events (view, add_to_cart, purchase).
      - name: products
        description: Product referential (catalogue domain).
      - name: customers
        description: Customer referential (customer domain). No attributes in the public data.
